name: Bug report
description: Report a reproducible problem in WP Reset Filters.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Report security vulnerabilities privately through GitHub Security Advisories.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: WP Reset Filters version
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Affected administration screen
      options:
        - Posts
        - Pages
        - Custom post type
        - Media
        - Users
        - Third-party administration screen
        - Multiple screens
        - Unsure
    validations:
      required: true
  - type: textarea
    id: url-context
    attributes:
      label: Filter and URL context
      description: List the active filters and include sanitized query parameters. Never include credentials or personal data.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant plugins, themes, and sanitized logs. Never include credentials or personal data.
